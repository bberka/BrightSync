# nfpm definition for deb / rpm / apk / archlinux packages.
# Rendered by packaging/build-linux.sh, which exports:
#   NFPM_ARCH     amd64 | arm64 | arm7
#   NFPM_VERSION  release version, e.g. 0.19.0
#   NFPM_SO       soname suffix for rpm dependencies: "()(64bit)" or empty
#   NFPM_PUBLISH directory holding the published BrightSync binary and native libraries
name: brightsync
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
section: utils
priority: optional
maintainer: BrightSync <https://github.com/bberka/BrightSync>
description: |
  Keep the brightness of every monitor aligned to one master value.
  DDC/CI for external monitors, backlight control for laptop panels, automatic
  brightness curve, idle dimming, eye protection and a command line interface.
vendor: BrightSync
homepage: https://github.com/bberka/BrightSync
license: MIT

contents:
  - src: ${NFPM_PUBLISH}/
    dst: /opt/brightsync/
    type: tree
    expand: true
    file_info:
      mode: 0755
  - src: /opt/brightsync/BrightSync
    dst: /usr/bin/brightsync
    type: symlink
  - src: packaging/linux/brightsync.desktop
    dst: /usr/share/applications/brightsync.desktop
  - src: src/BrightSync.UI/Resources/app.png
    dst: /usr/share/icons/hicolor/128x128/apps/brightsync.png
  - src: packaging/linux/60-brightsync-i2c.rules
    dst: /usr/lib/udev/rules.d/60-brightsync-i2c.rules
  - src: packaging/linux/brightsync-i2c.conf
    dst: /usr/lib/modules-load.d/brightsync-i2c.conf
  - src: LICENSE
    dst: /usr/share/licenses/brightsync/LICENSE

scripts:
  postinstall: packaging/linux/postinstall.sh
  postremove: packaging/linux/postremove.sh

# Runtime libraries Avalonia loads on X11 (verified on Ubuntu, Debian, Fedora, Alpine, Arch and openSUSE
# with tools/linux-vm-test). Optional ones only improve idle detection and link handling.
overrides:
  deb:
    depends:
      - libc6
      - libfontconfig1
      - libice6
      - libsm6
      - libx11-6
      - libxcursor1
      - libxext6
      - libxi6
      - libxrandr2
    recommends:
      - libgl1
      - libxss1
      - xdg-utils
  rpm:
    # Library sonames instead of package names: Fedora calls the package libICE, openSUSE libICE6, and both
    # provide the soname. NFPM_SO is "()(64bit)" on 64-bit targets and empty on 32-bit arm.
    depends:
      - libfontconfig.so.1${NFPM_SO}
      - libICE.so.6${NFPM_SO}
      - libSM.so.6${NFPM_SO}
      - libX11.so.6${NFPM_SO}
      - libXcursor.so.1${NFPM_SO}
      - libXext.so.6${NFPM_SO}
      - libXi.so.6${NFPM_SO}
      - libXrandr.so.2${NFPM_SO}
    recommends:
      - libXss.so.1${NFPM_SO}
      - libGL.so.1${NFPM_SO}
      - xdg-utils
  apk:
    depends:
      - fontconfig
      - libgcc
      - libice
      - libsm
      - libstdc++
      - libx11
      - libxcursor
      - libxext
      - libxi
      - libxrandr
  archlinux:
    depends:
      - fontconfig
      - libice
      - libsm
      - libx11
      - libxcursor
      - libxext
      - libxi
      - libxrandr
    # nfpm writes suggests as pacman optdepends.
    suggests:
      - libxss
      - xdg-utils
