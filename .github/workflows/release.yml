name: Build and Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      run_hardware_tests:
        description: Run the physical-monitor and integration tests on this manually started release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read and compute version
        id: version
        shell: pwsh
        run: |
          $baseVersion = (Get-Content VERSION -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($baseVersion)) {
            throw "VERSION file is empty."
          }

          git fetch --tags --force

          $escapedBase = [regex]::Escape($baseVersion)
          $pattern = "^v$escapedBase\.(\d+)$"
          $maxPatch = -1
          foreach ($tag in (git tag -l)) {
            if ($tag -match $pattern) {
              $patch = [int]$Matches[1]
              if ($patch -gt $maxPatch) {
                $maxPatch = $patch
              }
            }
          }

          $fullVersion = "$baseVersion.$($maxPatch + 1)"
          $tag = "v$fullVersion"
          Write-Host "Computed release version: $fullVersion"

          "version=$fullVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for matching CI run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          while (( SECONDS < deadline )); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$COMMIT_SHA" --limit 20 --json status,conclusion,event,databaseId)"
            ci_run="$(jq -c '[.[] | select(.event == "push")] | first // empty' <<< "$runs")"

            if [[ -z "$ci_run" ]]; then
              echo "Waiting for the CI workflow run for $COMMIT_SHA to appear..."
              sleep 15
              continue
            fi

            status="$(jq -r '.status' <<< "$ci_run")"
            conclusion="$(jq -r '.conclusion // empty' <<< "$ci_run")"
            echo "CI run status=$status conclusion=${conclusion:-pending}"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                exit 0
              fi

              echo "CI did not succeed: $ci_run" >&2
              exit 1
            fi

            sleep 15
          done

          echo "Timed out waiting for CI to complete for $COMMIT_SHA." >&2
          exit 1

  validate:
    name: validate (${{ matrix.os }})
    needs:
      - prepare
      - wait-for-ci
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    env:
      # The test project pulls in the app and exactly the platform projects for this OS. The solution also
      # lists the Windows project, which a Linux runner has no reason to compile here.
      SOLUTION_PATH: tests/BrightSync.Tests.csproj
      TEST_PROJECT_PATH: tests/BrightSync.Tests.csproj
      CONFIGURATION: Release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }} -r ${{ matrix.rid }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test hardware-safe suite
        if: ${{ inputs.run_hardware_tests != true }}
        run: >
          dotnet test --project ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-build
          --filter-not-trait "Category=Hardware" --filter-not-trait "Category=Integration"

      - name: Test full suite (manual hardware opt-in)
        if: ${{ inputs.run_hardware_tests == true }}
        run: dotnet test --project ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-build

  package-windows:
    needs:
      - prepare
      - validate
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - rid: win-x64
            suffix: win-x64
            arch: x64
          - rid: win-arm64
            suffix: win-arm64
            arch: arm64
          - rid: win-x86
            suffix: win-x86
            arch: x86
    env:
      PROJECT_PATH: src/BrightSync.App/BrightSync.App.csproj
      CONFIGURATION: Release
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      WINDOWS_SIGNING_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGNING_TIMESTAMP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }} -r ${{ matrix.rid }}

      - name: Validate Authenticode signing configuration
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          $hasTimestampUrl = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_TIMESTAMP_URL)
          $hasAnySigningSecret = $hasCertificate -or $hasPassword -or $hasTimestampUrl
          $hasAllSigningSecrets = $hasCertificate -and $hasPassword -and $hasTimestampUrl
          if ($hasAnySigningSecret -and -not $hasAllSigningSecrets) {
            throw "Authenticode signing requires WINDOWS_SIGNING_CERTIFICATE_BASE64, WINDOWS_SIGNING_CERTIFICATE_PASSWORD, and WINDOWS_SIGNING_TIMESTAMP_URL together."
          }

      - name: Publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "${{ matrix.suffix }}"
          $publishArgs = @(
            'publish',
            '${{ env.PROJECT_PATH }}',
            '-c', '${{ env.CONFIGURATION }}',
            '-r', '${{ matrix.rid }}',
            '--no-restore',
            '-p:PublishSingleFile=true',
            '-p:DebugType=None',
            '-p:DebugSymbols=false',
            '-p:Version=${{ needs.prepare.outputs.version }}',
            '-p:AssemblyVersion=${{ needs.prepare.outputs.version }}',
            '-p:FileVersion=${{ needs.prepare.outputs.version }}',
            '-p:InformationalVersion=${{ needs.prepare.outputs.version }}',
            '-o', $publishDir
          )

          dotnet @publishArgs

      - name: Optional Authenticode signing hook for published executable
        if: ${{ env.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "${{ matrix.suffix }}"
          $certificatePath = Join-Path $env:RUNNER_TEMP "BrightSync-signing-${{ matrix.suffix }}.pfx"
          $executablePath = Join-Path $publishDir 'BrightSync.exe'
          try {
            if (!(Test-Path -LiteralPath $executablePath -PathType Leaf)) {
              throw "Published executable was not found at $executablePath."
            }

            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $signtool = Get-Command signtool.exe -ErrorAction Stop
            & $signtool.Source sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr $env:WINDOWS_SIGNING_TIMESTAMP_URL /td SHA256 $executablePath
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for the published executable with exit code $LASTEXITCODE."
            }
          }
          finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction Stop
            }
          }

      - name: Archive publish output
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $publishDir = Join-Path $env:RUNNER_TEMP "${{ matrix.suffix }}"
          $packageDir = Join-Path $env:RUNNER_TEMP "package"
          $zipPath = Join-Path $env:RUNNER_TEMP "BrightSync-$version-${{ matrix.suffix }}.zip"
          if (!(Test-Path -LiteralPath $publishDir -PathType Container)) {
            throw "Publish directory was not created: $publishDir"
          }

          $files = @(Get-ChildItem -Path $publishDir -Recurse -File | Where-Object { $_.Extension -ne '.pdb' })
          $publishedExecutable = Join-Path $publishDir 'BrightSync.exe'
          if ($files.Count -eq 0 -or !(Test-Path -LiteralPath $publishedExecutable -PathType Leaf)) {
            throw "Publish output did not contain the expected BrightSync.exe executable."
          }

          if (Test-Path -LiteralPath $packageDir) {
            Remove-Item -LiteralPath $packageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zipPath, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($file in $files) {
              $entryPath = [System.IO.Path]::GetRelativePath($publishDir, $file.FullName)
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $archive,
                $file.FullName,
                $entryPath,
                [System.IO.Compression.CompressionLevel]::Optimal) | Out-Null
            }
          }
          finally {
            $archive.Dispose()
          }

          Copy-Item -LiteralPath $zipPath -Destination $packageDir -Force

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $publishDir = Join-Path $env:RUNNER_TEMP "${{ matrix.suffix }}"

          iscc `
            /dAppVersion=$version `
            "/dPublishDir=$publishDir" `
            /dAppArch=${{ matrix.arch }} `
            /O"$env:RUNNER_TEMP" `
            installer/installer.iss

          $setupPath = Join-Path $env:RUNNER_TEMP "BrightSync-Setup-v$version-win-${{ matrix.arch }}.exe"
          if (!(Test-Path -LiteralPath $setupPath)) {
            throw "Setup executable was not created."
          }

      - name: Optional Authenticode signing hook for installer
        if: ${{ env.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $setupPath = Join-Path $env:RUNNER_TEMP "BrightSync-Setup-v$version-win-${{ matrix.arch }}.exe"
          $certificatePath = Join-Path $env:RUNNER_TEMP "BrightSync-signing-${{ matrix.suffix }}.pfx"
          try {
            if (!(Test-Path -LiteralPath $setupPath -PathType Leaf)) {
              throw "Installer executable was not found at $setupPath."
            }

            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
            $signtool = Get-Command signtool.exe -ErrorAction Stop
            & $signtool.Source sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr $env:WINDOWS_SIGNING_TIMESTAMP_URL /td SHA256 $setupPath
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for the installer with exit code $LASTEXITCODE."
            }
          }
          finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction Stop
            }
          }

      - name: Collect package assets
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $packageDir = Join-Path $env:RUNNER_TEMP "package"
          $setupPath = Join-Path $env:RUNNER_TEMP "BrightSync-Setup-v$version-win-${{ matrix.arch }}.exe"
          Copy-Item -LiteralPath $setupPath -Destination $packageDir -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BrightSync-package-${{ matrix.suffix }}
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          retention-days: 7

  package-linux:
    name: package-linux (${{ matrix.rid }})
    needs:
      - prepare
      - validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native AOT on a runner of the same architecture.
          - rid: linux-x64
            runner: ubuntu-latest
            appimagetool: x86_64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            appimagetool: aarch64
          # Self-contained single file, cross-published from x64 (no AOT toolchain for these targets).
          - rid: linux-arm
            runner: ubuntu-latest
            appimagetool: x86_64
          - rid: linux-musl-x64
            runner: ubuntu-latest
            appimagetool: x86_64
          - rid: linux-musl-arm64
            runner: ubuntu-latest
            appimagetool: x86_64
          - rid: linux-musl-arm
            runner: ubuntu-latest
            appimagetool: x86_64
          # Framework-dependent build for riscv64, loongarch64, x86 and any other architecture with .NET 10.
          - rid: linux-portable
            runner: ubuntu-latest
            appimagetool: x86_64
    env:
      NFPM_VERSION: 2.47.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Install nfpm
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            x86_64) nfpm_arch=x86_64 ;;
            aarch64) nfpm_arch=arm64 ;;
            *) echo "Unsupported runner architecture $arch" >&2; exit 1 ;;
          esac
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          archive="nfpm_${NFPM_VERSION}_Linux_${nfpm_arch}.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL -o "$RUNNER_TEMP/nfpm-checksums.txt" "$base/nfpm_${NFPM_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" nfpm-checksums.txt | sha256sum --check -)
          mkdir -p "$RUNNER_TEMP/nfpm"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/nfpm" nfpm
          echo "NFPM=$RUNNER_TEMP/nfpm/nfpm" >> "$GITHUB_ENV"

      - name: Install appimagetool
        if: ${{ !contains(matrix.rid, 'musl') && matrix.rid != 'linux-portable' }}
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$tool"             "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimagetool }}.AppImage"
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          packaging/build-linux.sh "${{ matrix.rid }}" "${{ needs.prepare.outputs.version }}" "$RUNNER_TEMP/package"

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BrightSync-package-${{ matrix.rid }}
          path: ${{ runner.temp }}/package/*
          if-no-files-found: error
          retention-days: 7

  smoke-linux:
    name: smoke-linux (${{ matrix.rid }})
    needs:
      - prepare
      - package-linux
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BrightSync-package-${{ matrix.rid }}
          path: package

      - name: Install the .deb with a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 ./package/BrightSync-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.deb

      - name: Package contents
        run: |
          set -euo pipefail
          dpkg -L brightsync
          test -x /usr/bin/brightsync
          test -f /usr/lib/udev/rules.d/99-brightsync-i2c.rules
          test -f /usr/share/applications/brightsync.desktop

      - name: Launch the tray app and query it over the CLI
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a dbus-run-session -- bash -c '
            brightsync --autostart > "$RUNNER_TEMP/brightsync.out" 2>&1 &
            app=$!
            for _ in $(seq 1 30); do
              if brightsync status; then ok=1; break; fi
              sleep 1
            done
            kill -0 "$app"
            kill "$app"
            [ "${ok:-0}" = 1 ]
          ' || { cat "$RUNNER_TEMP/brightsync.out" || true; ls ~/.config/BrightSync/Logs 2>/dev/null && tail -n 80 ~/.config/BrightSync/Logs/*.log; exit 1; }

  release:
    needs:
      - prepare
      - package-windows
      - package-linux
      - smoke-linux
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: BrightSync-package-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            "BrightSync-${RELEASE_VERSION}-win-x64.zip"
            "BrightSync-${RELEASE_VERSION}-win-arm64.zip"
            "BrightSync-${RELEASE_VERSION}-win-x86.zip"
            "BrightSync-Setup-v${RELEASE_VERSION}-win-x64.exe"
            "BrightSync-Setup-v${RELEASE_VERSION}-win-arm64.exe"
            "BrightSync-Setup-v${RELEASE_VERSION}-win-x86.exe"
            "BrightSync-${RELEASE_VERSION}-linux-portable.tar.gz"
          )
          for rid in linux-x64 linux-arm64 linux-arm; do
            for ext in tar.gz deb rpm pkg.tar.zst AppImage; do
              expected+=("BrightSync-${RELEASE_VERSION}-${rid}.${ext}")
            done
          done
          for rid in linux-musl-x64 linux-musl-arm64 linux-musl-arm; do
            for ext in tar.gz apk; do
              expected+=("BrightSync-${RELEASE_VERSION}-${rid}.${ext}")
            done
          done
          shopt -s nullglob
          assets=(*)
          if (( ${#assets[@]} != ${#expected[@]} )); then
            printf 'Unexpected release asset count: expected %d, found %d\n' "${#expected[@]}" "${#assets[@]}" >&2
            exit 1
          fi
          for asset in "${expected[@]}"; do
            test -f "$asset"
          done
          sha256sum -- "${expected[@]}" > BrightSync-SHA256SUMS.txt
          test -s BrightSync-SHA256SUMS.txt
          test "$(wc -l < BrightSync-SHA256SUMS.txt)" -eq "${#expected[@]}"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TARGET: ${{ needs.prepare.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --notes "Automated release for version $RELEASE_TAG."
          fi

      - name: Upload release assets and checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
