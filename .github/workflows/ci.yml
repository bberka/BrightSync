name: CI

# Pull requests (any base branch) get the full checks and testable packages. Branches without a pull request
# run nothing; main and master are checked on push because the release workflow waits for that result.
on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
    env:
      # The test project pulls in the app and exactly the platform projects for this OS. The solution also
      # lists the Windows project, which a Linux runner has no reason to compile here.
      SOLUTION_PATH: tests/BrightSync.Tests.csproj
      TEST_PROJECT_PATH: tests/BrightSync.Tests.csproj
      CONFIGURATION: Debug
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test hermetic suite
        # xUnit v3 runs on Microsoft.Testing.Platform (global.json). Hardware and Integration tests
        # stay available to developers but are opt-in locally.
        run: >
          dotnet test --project ${{ env.TEST_PROJECT_PATH }} -c ${{ env.CONFIGURATION }} --no-build
          --filter-not-trait "Category=Hardware" --filter-not-trait "Category=Integration"

  # Cross-builds both platform graphs on one host so a Windows-only API in shared code, or a Linux-only
  # one in the Windows project, fails the pull request before it reaches a platform runner.
  cross-platform-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build Windows graph
        run: >
          dotnet build src/BrightSync.App/BrightSync.App.csproj -c Debug -r win-x64 -p:EnableWindowsTargeting=true

      - name: Build Linux graph
        run: dotnet build src/BrightSync.App/BrightSync.App.csproj -c Debug -r linux-x64

  # Metadata for pr-packages.yml, which posts the comment from a trusted context (a pull request from a
  # fork cannot comment, and its code must never run with a write token).
  pr-meta:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record pull request number and commit
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir pr-meta
          echo "$PR_NUMBER" > pr-meta/meta.txt
          echo "$PR_HEAD_SHA" >> pr-meta/meta.txt

      - name: Upload metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-meta
          path: pr-meta/meta.txt
          retention-days: 3

  pr-version:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the pull request build version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          echo "version=${base}.0-pr${PR_NUMBER}.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  # Builds every installer and package so reviewers can try the change. Nothing is published or tagged.
  # Starts only after the tests pass and skips draft pull requests.
  packages:
    needs:
      - build-and-test
      - cross-platform-compile
      - pr-version
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ needs.pr-version.outputs.version }}
      retention-days: "14"
