version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      avalonia:
        patterns:
          - Avalonia*
      test-tooling:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
          - coverlet*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only; 7 breaks the website build (npm ERESOLVE).
      # Remove this once @astrojs/check lists TypeScript 7 as a supported peer.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
